name: Integration

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Mercari integration test
        env:
          SANSAI_INTEGRATION: "1"
        run: go test ./internal/market/mercari/ -run Integration -v
